<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Registration & Feedback Form</h2>
    <form action="">
        <!-- username field -->
        <label for="username">1. Username:</label>
        <input type="text" id="username" name="username" required> <br><br>

        <!-- email field -->
        <label for="email">2. Email:</label>
        <input type="email" id="email" name="email" required> <br><br>

        <!-- password field -->
        <label for="password">3. Password:</label>
        <input type="password" id="password" name="password" required> <br><br>

        <!-- confirm password field -->
        <label for="confirm_password">4. Confirm Password:</label>
        <input type="password" id="confirm_password" name="confirm_password" required> <br><br>

        <!-- Date of Birth field -->
        <label for="date_of_birth">5. Date of Birth:</label>
        <input type="date" id="date_of_birth" name="date_of_birth" required> <br><br>

        <!--Age field -->
        <label for="age">6. Age:</label>
        <input type="number" id="age" name="age" min="0"> <br><br>

        <!-- Gender field -->
        <label for="gender">7. Gender:</label> <br>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label> <br><br>

        <!-- Profile Picture field -->
        <label for="profile_picture">8. Profile Picture:</label> <br>
        <input type="file" id="profile_picture" name="profile_picture" accept="image/*"> <br><br>

        <!-- Preferred Domain field -->
        <label for="preferred_domain">9. Preferred Domain:</label>
        <input type="text" id="preferred_domain" name="preferred_domain"> <br><br>

        <!-- Skills field -->
        <label for="skills">10. Skills:</label> <br>
        <input type="checkbox" id="skill1" name="skills" value="JavaScript"> JavaScript <br>
        <input type="checkbox" id="skill2" name="skills" value="Python"> Python <br>
        <input type="checkbox" id="skill3" name="skills" value="Java"> Java <br><br>

        <!-- Experience level field -->
        <label for="experience_level">11. Experience Level:</label> <br>
        <span>Beginner</span>
        <input type="range" id="experience_level" name="experience_level" min="0" max="10" step="1">
        <span>Expert</span> <br><br>
        
        <!-- Preferred Start Date field -->
        <label for="preferred_start_date">12. Preferred Start Date:</label>
        <input type="date" id="preferred_start_date" name="preferred_start_date"> <br><br>

        <!--Preferred Time field -->
        <label for="preferred_time">13. Preferred Time:</label>
        <input type="time" id="preferred_time" name="preferred_time"> <br><br>

        <!-- Feedback field -->
        <label for="feedback">14. Feedback:</label> <br>
        <textarea name="feedback" id="feedback" placeholder="Enter your feedback"></textarea> <br><br>
    </form>
</body>
</html>
