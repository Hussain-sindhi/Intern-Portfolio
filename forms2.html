<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Personal Information</h2>
    <form action="">
        <!-- fullname fields -->
        <label for="FullName">1. Full Name:</label> <br>
        <input type="text" id="FullName" name="FullName" placeholder="Enter Your FullName" required> <br><br>

        <!-- email field -->
        <label for="Email">2. Email:</label> <br>
        <input type="email" id="Email" name="Email" placeholder="Enter Your Email" required> <br><br>

        <!-- Password field -->
        <label for="Password">3. Password:</label> <br>
        <input type="password" id="Password" name="Password" placeholder="Enter Your Password" required> <br><br>

        <label for="ConfirmPassword">4. Confirm Password:</label> <br>
        <input type="password" id="ConfirmPassword" name="ConfirmPassword" placeholder="Confirm Your Password" required> <br><br>

        <!-- Mobile field -->
        <label for="Mobile">5. Mobile:</label> <br>
        <input type="tel" id="Mobile" name="Mobile" placeholder="Enter Your Mobile Number" required> <br><br>

        <!-- Date of Birth field -->
        <label for="DOB">6. Date of Birth:</label> <br>
        <input type="date" id="DOB" name="DOB" required> <br><br>

        <!-- time field -->
        <label for="Time">7. Time:</label> <br>
        <input type="time" id="Time" name="Time" required> <br><br>

        <!-- Gender field -->
        <label for="Gender">8. Gender:</label> <br>
        <select id="Gender" name="Gender" required>
            <option value="">Select Gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
        </select> <br><br>

        <!-- Age field -->
        <label for="Age">9. Age:</label> <br>
        <input type="number" id="Age" name="Age" placeholder="Enter Your Age" required> <br><br>

        <!-- Website field -->
        <label for="Website">10. Website:</label> <br>
        <input type="url" id="Website" name="Website" placeholder="Enter Your Website URL"> <br><br>

        <!-- Search field -->
        <label for="Search">11. Search:</label> <br>
        <input type="search" id="Search" name="Search" placeholder="Enter your search query"> <br><br>

        <!-- Favorite Color field -->
        <label for="Color">12. Favorite Color:</label> <br>
        <input type="color" id="Color" name="Color" required> <br><br>

        <!-- range field -->
        <label for="Range">13. Range:</label> <br>
        <input type="range" id="Range" name="Range" min="0" max="100" required> <br><br>

        <!-- Portfolio field -->
        <label for="Portfolio">14. Portfolio:</label> <br>
        <input type="file" id="Portfolio" name="Portfolio" accept=".pdf,.doc,.docx" required> <br><br>

        <input type="submit" style="color: white; background-color:blueviolet; border: 1px solid #ccc;" value="Submit">
        <input type="reset" style="color: white; background-color:blueviolet; border: 1px solid #ccc;" value="Reset">
    </form>
    
</body>
</html>
